<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Verification...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --border: #1e1e2e;
            --text: #e4e4e7;
            --text-dim: #a1a1aa;
            --accent: #6366f1;
            --success: #22c55e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .spinner-container {
            margin-bottom: 24px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h2 {
            font-size: 24px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--success), #16a34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.6;
        }

        .progress {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .progress-step {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .progress-step.active {
            color: var(--accent);
            font-weight: 600;
        }

        .progress-step.done {
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        
        <h2>✅ Work.ink Complete!</h2>
        <p id="message">Verifying completion with server...</p>

        <div class="progress">
            <div class="progress-step done">✓ Discord joined</div>
            <div class="progress-step active" id="step2">⋯ Verifying Work.ink...</div>
            <div class="progress-step" id="step3">○ Generating key...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://broad-base-cf81.gegidzezviad05.workers.dev';
        const PAGE3_URL = 'https://da7muhub.vercel.app/keysystem3.html';
        const PAGE1_URL = 'https://da7muhub.vercel.app/keysystem1.html';

        const message = document.getElementById('message');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');

        async function processVerification() {
            const sessionData = sessionStorage.getItem('da7mu_session');

            if (!sessionData) {
                message.textContent = '❌ No session found. Redirecting...';
                setTimeout(() => window.location.href = PAGE1_URL, 2000);
                return;
            }

            try {
                const session = JSON.parse(sessionData);
                
                // Check session expiry
                const elapsed = Date.now() - session.created_at;
                if (elapsed > 3600000) {
                    message.textContent = '⏰ Session expired. Redirecting...';
                    sessionStorage.clear();
                    setTimeout(() => window.location.href = PAGE1_URL, 2000);
                    return;
                }

                // Call API to mark Work.ink as complete
                message.textContent = 'Submitting verification to server...';
                
                const response = await fetch(`${API_BASE}/api/set_workink_complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tracking_id: session.tracking_id })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    step2.textContent = '✓ Work.ink verified';
                    step2.classList.remove('active');
                    step2.classList.add('done');
                    step3.classList.add('active');
                    
                    message.textContent = '✅ Verification successful! Redirecting to final step...';
                    
                    setTimeout(() => {
                        window.location.href = PAGE3_URL;
                    }, 1500);
                } else {
                    throw new Error(data.error || 'Verification failed');
                }
            } catch (error) {
                message.textContent = `❌ Error: ${error.message}`;
                step2.textContent = '✗ Verification failed';
                step2.style.color = '#ef4444';
                setTimeout(() => window.location.href = PAGE1_URL, 3000);
            }
        }

        processVerification();
    </script>
</body>
</html>
